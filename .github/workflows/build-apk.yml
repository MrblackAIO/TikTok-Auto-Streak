name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Verify Signing Keystore
        shell: pwsh
        run: |
          $keystorePath = "src/TiktokStreakSaver/streaksaver.keystore"
          if (Test-Path $keystorePath) {
            Write-Host "Dedicated streaksaver.keystore verified in repository (Size: $((Get-Item $keystorePath).Length) bytes)."
          } else {
            Write-Error "streaksaver.keystore not found! Permanent signing keystore must be committed."
            exit 1
          }

      - name: Build and Package APK
        run: |
          dotnet restore src/TiktokStreakSaver/TiktokStreakSaver.csproj -p:TargetFramework=net9.0-android
          dotnet publish src/TiktokStreakSaver/TiktokStreakSaver.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true -p:AndroidSigningStorePass=autostreak123 -p:AndroidSigningKeyPass=autostreak123 --no-restore

      - name: Standardize APK Filename
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/TiktokStreakSaver/bin/Release/net9.0-android -Filter "*-Signed.apk" -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path src/TiktokStreakSaver/bin/Release/net9.0-android -Filter "*.apk" -Recurse | Select-Object -First 1
          }
          if ($apk) {
            Write-Host "Found APK at $($apk.FullName), copying to TikTok-AutoStreak.apk"
            Copy-Item -Path $apk.FullName -Destination "src/TiktokStreakSaver/bin/Release/net9.0-android/TikTok-AutoStreak.apk" -Force
          } else {
            Write-Error "No APK was generated during dotnet publish!"
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-AutoStreak-APK
          path: src/TiktokStreakSaver/bin/Release/net9.0-android/*.apk
